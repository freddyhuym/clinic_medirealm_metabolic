  .dv-figure { margin: 0; background: var(--xy-warm-white); border: 1px solid var(--xy-border); border-radius: var(--radius); overflow: hidden; }
  .dv-figure img { display: block; width: 100%; height: auto; object-fit: contain; }

  .dv-feature-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 10px; margin-bottom: 26px; }
