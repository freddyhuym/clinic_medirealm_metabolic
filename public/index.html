      <div class="popular-viewport" id="popViewport">
        <div class="popular-track" id="popTrack"></div>

<!-- ── 02 關於纖顏 ─────────────────────── -->
<section class="section philosophy" id="about">
  <div class="wrap">
    <div class="phi-top">
      <div class="phi-text">
        <p class="eyebrow" id="aboutEyebrow"></p>

        <p class="phi-subtitle serif" id="aboutSubtitle"></p>
        <div class="gold-divider" aria-hidden="true"></div>
        <div class="phi-manifesto" id="aboutBody"></div>
      </div>
      <figure class="phi-visual reveal" aria-label="代謝、體態與美學相互關聯的品牌圖形">
        <svg viewBox="0 0 560 520" role="img">
          <defs>
            <radialGradient id="phiGlow" cx="50%" cy="48%" r="55%">
              <stop offset="0%" stop-color="#72BAB4" stop-opacity=".09"/>
              <stop offset="100%" stop-color="#FBF8F3" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <rect width="560" height="520" fill="url(#phiGlow)"/>
          <!-- 三環：代謝／體態／美學 -->
          <circle cx="238" cy="208" r="128" fill="none" stroke="#CE9A4B" stroke-opacity=".5" stroke-width="1.2" stroke-dasharray="620 200"/>

          <text x="118" y="86" font-size="11" letter-spacing="3" fill="#CE9A4B">METABOLIC</text>
          <text x="118" y="104" font-size="13" fill="#77716B">代謝</text>
          <text x="452" y="248" font-size="11" letter-spacing="3" fill="#417F7C">BODY</text>
          <text x="452" y="266" font-size="13" fill="#77716B">體態</text>
          <text x="150" y="446" font-size="11" letter-spacing="3" fill="#7d9179">AESTHETICS</text>
          <text x="150" y="464" font-size="13" fill="#77716B">美學</text>
          <line x1="168" y1="94" x2="204" y2="130" stroke="#CE9A4B" stroke-opacity=".35" stroke-width="1"/>
          <line x1="446" y1="256" x2="404" y2="262" stroke="#72BAB4" stroke-opacity=".4" stroke-width="1"/>
          <line x1="210" y1="440" x2="240" y2="404" stroke="#9EB79B" stroke-opacity=".4" stroke-width="1"/>

      <span class="phi-closing-sig" id="phiClosingSig"></span>
    </div>
  </div>
</section>

<!-- ── 03 三大核心 ─────────────────────── -->
<section class="section pillars" id="services">
  <div class="wrap">
    <p class="eyebrow center" id="pillarsEyebrow"></p>
    <h2 class="h2 serif center" id="pillarsTitle"></h2>
    <p class="pillars-subtitle center" id="pillarsSubtitle"></p>
    <div class="pillar-grid" id="pillarGrid"></div>
    <p class="pillars-footnote center" id="pillarsFootnote"></p>
  </div>
</section>

<!-- ── 04 不是先選療程 ─────────────────── -->
<section class="section understand" id="understand">
  <div class="wrap und-grid">
    <div class="understand-inner">
      <p class="eyebrow" id="undEyebrow"></p>
      <h2 class="h2 serif" id="undTitle"></h2>
      <p class="und-lead" id="undLead"></p>
      <ul class="und-questions" id="undQuestions"></ul>
      <p class="und-body" id="undBody"></p>
      <div id="undCta"></div>
    </div>
    <figure class="und-visual reveal" id="undVisual">
      <span class="und-visual-arc" aria-hidden="true"></span>
    </figure>
  </div>
</section>

<!-- ── 05 三大院所（保留 #locations anchor）── -->
<section class="section clinics" id="locations">
  <div class="wrap">
    <p class="eyebrow center" id="clinicsEyebrow"></p>
    <h2 class="h2 serif center" id="clinicsTitle"></h2>
    <p class="section-intro center" id="clinicsIntro"></p>
    <div class="clinic-panels" id="clinicPanels"></div>
  </div>
</section>

<!-- ── 06 多位醫師共同主理 ─────────────── -->
<section class="section team" id="team">
  <div class="wrap team-inner">
    <p class="eyebrow center" id="teamEyebrow"></p>
    <h2 class="h2 serif center" id="teamTitle"></h2>
    <p class="team-subtitle center" id="teamSubtitle"></p>
    <div class="team-prose" id="teamBody"></div>
    <div class="doctor-carousel">
      <button type="button" class="carousel-btn prev" id="teamPrev" aria-label="上一位醫師">←</button>
      <div class="doctor-track" id="doctorGrid" tabindex="0" aria-label="醫療團隊卡片，可左右滑動"></div>
      <button type="button" class="carousel-btn next" id="teamNext" aria-label="下一位醫師">→</button>
    </div>
    <p class="team-note center" id="teamNote"></p>
  </div>
</section>

<!-- ── 08 醫境知識庫（Sticky Scroll Story）── -->
<section class="section knowledge" id="knowledge">
  <span class="kn-bgword" aria-hidden="true">KNOWLEDGE</span>
  <div class="wrap kn-layout">
    <header class="kn-intro">
      <div class="kn-intro-sticky">
        <p class="eyebrow" id="knEyebrow"></p>
        <p class="kn-label serif" id="knLabel"></p>
        <h2 class="h2 serif" id="knTitle"></h2>
        <p class="kn-copy" id="knIntro"></p>
        <div class="kn-progress" aria-hidden="true">
          <span class="kn-progress-num" id="knProgressNum">01 / 04</span>
          <span class="kn-progress-bar"><i id="knProgressFill"></i></span>
        </div>
        <a class="kn-more" id="knMore" href="/knowledge"></a>
      </div>
    </header>
    <div class="kn-stream" id="knArticles"></div>
  </div>
</section>

<!-- ── 預約諮詢 ─────────────────────────── -->
<section class="section contact" id="contact">
  <div class="wrap contact-grid">
    <div class="contact-info">
      <p class="eyebrow" id="contactEyebrow"></p>
      <h2 class="h2 serif" id="contactTitle"></h2>
      <p class="section-intro" id="contactSubtitle"></p>
      <dl class="hours" id="hours"></dl>
      <div class="contact-lines" id="contactLines"></div>
    </div>

    <form class="form" id="bookingForm" novalidate>
      <div class="field">
        <label for="fName">姓名 <span aria-hidden="true">*</span></label>
        <input id="fName" name="name" type="text" autocomplete="name" required>
      </div>
      <div class="field">
        <label for="fPhone">聯絡電話 <span aria-hidden="true">*</span></label>
        <input id="fPhone" name="phone" type="tel" autocomplete="tel" inputmode="tel" required>
      </div>
      <div class="field">
        <label for="fClinic">希望院所</label>
        <select id="fClinic" name="clinic"></select>
      </div>
      <div class="field">
        <label for="fTopic">諮詢方向</label>
        <select id="fTopic" name="topic"></select>
      </div>
      <div class="field field-full">
        <label for="fNote">想先讓我們知道的事</label>
        <textarea id="fNote" name="note" rows="4"></textarea>
      </div>
      <p class="consent" id="formConsent"></p>
      <button class="btn btn-solid" type="submit">送出預約</button>
      <p class="form-status" id="formStatus" role="status" aria-live="polite"></p>
    </form>
  </div>
</section>

</main>

<!-- ── 頁尾 ─────────────────────────────── -->
<footer class="footer">
  <div class="wrap">
    <p class="footer-wordmark">纖顏醫境<i>XIAN YAN · MEDIREALM</i></p>
    <p class="footer-desc" id="footerDesc"></p>
    <ul class="footer-clinics" id="footerClinics"></ul>
    <nav class="footer-nav" id="footerNav" aria-label="頁尾選單"></nav>
    <p class="footer-disclaimer" id="footerDisclaimer"></p>
    <small class="footer-copy">© <span id="year"></span> <span id="footerGroup"></span>　|　<a id="footerGroupLink" href="#" target="_blank" rel="noopener noreferrer"></a></small>
  </div>
</footer>

<a class="fab-line" id="fabLine" href="#contact" aria-label="預約諮詢">
  <span>預約</span>
</a>
