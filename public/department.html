<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  .dp-hero { background: var(--xy-ivory); padding: 150px 24px 70px; }
  .dp-hero-inner { max-width: 760px; margin: 0 auto; }
  .dp-breadcrumb { font-size: 13.5px; color: var(--xy-text-secondary); letter-spacing: .04em; margin-bottom: 30px; }
  .dp-breadcrumb a { color: var(--xy-teal-dark); border-bottom: 1px solid rgba(206,154,75,.4); padding-bottom: 2px; }
  .dp-breadcrumb a:hover { color: var(--xy-gold); }
  .dp-hero .eyebrow { margin-bottom: 10px; }
  .dp-name { font-family: var(--serif); font-size: clamp(30px, 4.2vw, 44px); font-weight: 500; line-height: 1.5; }
  .dp-tagline { font-family: var(--serif); font-size: clamp(18px, 2vw, 22px); font-weight: 500; color: var(--xy-teal-dark); margin-top: 12px; }
  .dp-lead { margin-top: 18px; font-size: 16.5px; line-height: 2; color: var(--xy-text-secondary); max-width: 620px; }
  .dp-hero-actions { margin-top: 30px; display: flex; gap: 14px; flex-wrap: wrap; }

  /* 有海報圖時的分割式 Hero（圖片＋文字；圖片用 order 排到前面，桌機在左、手機在上）── */
  .dp-hero-split .dp-hero-split-inner {
    max-width: 1080px; margin: 0 auto;
    display: grid; grid-template-columns: 45fr 55fr;
    gap: clamp(32px, 4.5vw, 72px); align-items: center;
  }
  .dp-hero-split .dp-lead { max-width: none; }
  .dp-hero-visual {
    order: -1;
    position: relative; border-radius: 20px; overflow: hidden;
    box-shadow: 0 26px 64px rgba(60, 55, 45, .14);
    border: 1px solid var(--xy-border);
    aspect-ratio: 4 / 4.8; max-height: 560px;
  }
  .dp-hero-visual img { width: 100%; height: 100%; object-fit: cover; object-position: center top; display: block; }
  .dp-closing { text-align: center; font-size: clamp(18px, 2.2vw, 22px); font-weight: 500; color: var(--xy-teal-dark); margin-bottom: 18px; }
  @media (max-width: 900px) {
    .dp-hero-split .dp-hero-split-inner { grid-template-columns: 1fr; }
    .dp-hero-visual { max-width: 420px; margin: 0 auto; }
  }

  .dp-status-note {
    margin-top: 26px; padding: 16px 20px; border-radius: 14px;
    background: var(--xy-warm-white); border: 1px solid rgba(206,154,75,.3);
    font-size: 14px; line-height: 1.8; color: var(--xy-text-secondary);
  }
  .dp-status-note b { color: var(--xy-teal-dark); font-weight: 500; }

  .dp-main { background: var(--xy-cream); padding: 10px 24px 0; }
  .dp-main-inner { max-width: 760px; margin: 0 auto; }
  .dp-section { padding: 56px 0; border-bottom: 1px solid var(--xy-border); }
  .dp-section:last-child { border-bottom: none; }
  .dp-section h2 { font-family: var(--serif); font-size: clamp(21px, 2.6vw, 27px); font-weight: 500; margin-bottom: 20px; }

  .dp-need-list { list-style: none; }
  .dp-need-list li {
    position: relative; padding: 10px 0 10px 26px; font-size: 16px; color: var(--xy-text);
  }
  .dp-need-list li::before {
    content: ''; position: absolute; left: 4px; top: 50%; transform: translateY(-50%);
    width: 6px; height: 6px; border-radius: 50%; background: var(--xy-gold);
  }

  .dp-cat-grid { display: grid; gap: 16px; }
  .dp-cat-card {
    background: var(--xy-warm-white); border: 1px solid var(--xy-border); border-radius: 16px;
    padding: 22px 24px; box-shadow: 0 10px 28px rgba(60, 55, 45, .05);
  }
  .dp-cat-card h3 { font-family: var(--serif); font-size: 17.5px; font-weight: 500; margin-bottom: 6px; }
  .dp-cat-card p { font-size: 14.5px; line-height: 1.8; color: var(--xy-text-secondary); }
  .dp-cat-note { margin-top: 18px; font-size: 13.5px; line-height: 1.8; color: var(--xy-text-secondary); font-style: italic; }

  .dp-highlight-list { list-style: none; }
  .dp-highlight-list li {
    position: relative; padding: 9px 0 9px 26px; font-size: 15.5px; line-height: 1.8; color: var(--xy-text-secondary);
  }
  .dp-highlight-list li::before {
    content: '—'; position: absolute; left: 0; top: 9px; color: var(--xy-gold);
  }

  .dp-faq-list { }
  .dp-faq-item { padding: 18px 0; border-bottom: 1px solid var(--xy-border); }
  .dp-faq-item:last-child { border-bottom: none; }
  .dp-faq-q { font-size: 16px; font-weight: 500; color: var(--xy-text); }
  .dp-faq-a { margin-top: 8px; font-size: 14.5px; line-height: 1.8; color: var(--xy-text-secondary); }

  .dp-cta { background: var(--xy-ivory); padding: 80px 24px; text-align: center; margin-top: 30px; }
  .dp-cta-inner { max-width: 560px; margin: 0 auto; }
  .dp-cta h2 { font-family: var(--serif); font-size: clamp(22px, 2.8vw, 28px); font-weight: 500; }
  .dp-cta p { margin-top: 14px; font-size: 15px; line-height: 1.9; color: var(--xy-text-secondary); }
  .dp-cta-actions { margin-top: 26px; display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }

  .dp-empty { padding: 60px 24px; text-align: center; }
  .dp-empty h1 { font-family: var(--serif); font-size: 26px; margin-bottom: 14px; }
  .dp-empty p { color: var(--xy-text-secondary); }

  @media (max-width: 640px) {
    .dp-hero { padding: 128px 20px 50px; }
  }
</style>
</head>
