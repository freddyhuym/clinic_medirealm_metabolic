<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>醫療團隊｜初纖顏醫境診所 XIAN YAN · MEDIREALM</title>
<meta name="description" content="纖顏醫境醫療團隊醫師介紹。">
<link rel="icon" href="/images/chu-logo-mark.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="/styles.css?v=48">
<style>
  /* ═══ 醫師個人頁：參考琢藝醫師頁版型（照片＋資料並排、門診表、認證徽章），配色沿用纖顏 ═══ */

  /* ── Hero：左照片、右姓名／標籤／經歷專長 ── */
  .dx-hero-section { background: var(--xy-ivory); padding: 128px 24px 96px; }
  .dx-breadcrumb {
    max-width: 1160px; margin: 0 auto 36px;
    font-size: 13px; letter-spacing: .12em; color: var(--xy-text-secondary);
  }
  .dx-breadcrumb a { color: var(--xy-text-secondary); transition: color .3s var(--ease); }
  .dx-breadcrumb a:hover { color: var(--xy-gold); }
  .dx-breadcrumb .sep { margin: 0 10px; color: var(--xy-gold); }
  .dx-hero {
    max-width: 1160px; margin: 0 auto;
    display: grid; grid-template-columns: minmax(0, 40fr) minmax(0, 60fr);
    gap: clamp(36px, 5vw, 72px); align-items: start;
  }
  .dx-portrait {
    border: 1px solid var(--xy-border); border-radius: 16px; overflow: hidden;
    aspect-ratio: 3 / 4;
    background: linear-gradient(165deg, rgba(114,186,180,.08), rgba(251,248,243,.92) 55%, rgba(228,190,124,.12));
    box-shadow: 0 26px 64px rgba(60, 55, 45, .1);
    position: sticky; top: 100px;
  }
  .dx-portrait img { width: 100%; height: 100%; object-fit: cover; object-position: center top; display: block; }
  .dx-eyebrow { font-family: var(--display); font-size: 13px; letter-spacing: .34em; text-transform: uppercase; color: var(--xy-gold); }
  .dx-name { font-family: var(--serif); font-size: clamp(38px, 4.8vw, 56px); font-weight: 500; line-height: 1.3; margin-top: 10px; letter-spacing: .04em; }
  .dx-name small { font-size: .6em; color: var(--xy-text-secondary); margin-left: 10px; letter-spacing: .08em; }
  .dx-title { font-family: var(--serif); font-size: clamp(17px, 1.8vw, 20px); color: var(--xy-teal-dark); margin-top: 10px; letter-spacing: .06em; }
  .dx-rule { width: 56px; height: 1px; background: var(--xy-gold); margin: 22px 0 26px; }
  .dx-specs { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 34px; }
  .dx-specs:empty { display: none; }
  .dx-spec-tag {
    font-family: var(--serif); font-size: 15px; letter-spacing: .1em; color: var(--xy-text);
    padding: 9px 20px; border: 1px solid var(--xy-border); border-radius: 6px; background: var(--xy-warm-white);
    transition: border-color .3s var(--ease), color .3s var(--ease);
  }
  a.dx-spec-tag:hover { border-color: var(--xy-gold); color: var(--xy-teal-dark); }

  .dx-bio-block { display: grid; grid-template-columns: 64px 1fr; gap: 18px; margin-bottom: 26px; }
  .dx-bio-label {
    font-family: var(--serif); font-size: 15px; letter-spacing: .3em; color: var(--xy-gold);
    border-right: 1px solid var(--xy-border); padding: 2px 10px 0 0; height: fit-content; text-align: right;
  }
  .dx-bio-list { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 28px; }
  .dx-bio-list li { position: relative; padding-left: 16px; font-size: 15.5px; line-height: 1.85; color: var(--xy-text); }
  .dx-bio-list li::before { content: "–"; position: absolute; left: 0; color: var(--xy-gold); }
  .dx-hero-meta { margin: 6px 0 30px; display: grid; gap: 8px; }
  .dx-hero-meta:empty { display: none; }
  .dx-hero-meta p { font-size: 14.5px; letter-spacing: .06em; color: var(--xy-text); }
  .dx-hero-meta b { font-weight: 500; color: var(--xy-gold); margin-right: 12px; letter-spacing: .14em; }
  .dx-hero-cta {
    display: inline-flex; align-items: center; gap: 12px;
    padding: 16px 34px; border-radius: 8px;
    background: var(--xy-teal); color: #fff; font-size: 16px; letter-spacing: .12em;
    box-shadow: 0 14px 30px rgba(89, 170, 165, .25);
    transition: background .35s var(--ease), transform .35s var(--ease);
  }
  .dx-hero-cta:hover { background: var(--xy-teal-deep); transform: translateY(-2px); }
  .dx-hero-cta i { font-style: normal; transition: transform .35s var(--ease); }
  .dx-hero-cta:hover i { transform: translateX(4px); }

  /* ── 共用區塊標題 ── */
  .dx-section { padding: clamp(72px, 8vw, 110px) 24px; }
  .dx-head { text-align: center; margin-bottom: 44px; }
  .dx-head .eyebrow { margin-bottom: 10px; }
  .dx-head h2 { font-family: var(--serif); font-size: clamp(28px, 3.4vw, 40px); font-weight: 500; letter-spacing: .08em; line-height: 1.5; }
  .dx-head h2 strong { font-weight: 500; color: var(--xy-gold); }

  /* ── 醫師介紹＋理念 ── */
  .dx-about { background: var(--xy-cream); }
  .dx-about-inner { max-width: 760px; margin: 0 auto; }
  .dx-about-body p { font-size: 16.5px; line-height: 2.05; color: var(--xy-text-secondary); margin-bottom: 16px; }
  .dx-quote {
    margin-top: 40px; padding: 38px clamp(24px, 4vw, 48px); text-align: center;
    background: var(--xy-warm-white); border: 1px solid var(--xy-border); border-radius: 16px;
  }
  .dx-quote h3 { font-family: var(--serif); font-size: clamp(21px, 2.4vw, 26px); font-weight: 500; color: var(--xy-teal-dark); }
  .dx-quote p { margin-top: 14px; font-size: 15.5px; line-height: 2; color: var(--xy-text-secondary); }

  /* ── 門診表 ── */
  .dx-hours { background: var(--xy-ivory); }
  .dx-hours-inner { max-width: 900px; margin: 0 auto; text-align: center; }
  .dx-clinic-grid {
    display: grid; grid-template-columns: repeat(7, 1fr);
    border: 1px solid var(--xy-border); border-radius: 12px; overflow: hidden; background: var(--xy-warm-white);
  }
  .dx-clinic-cell { padding: 22px 6px; border-left: 1px solid var(--xy-border); }
  .dx-clinic-cell:first-child { border-left: none; }
  .dx-clinic-wd { font-family: var(--serif); font-size: 17px; color: var(--xy-text); }
  .dx-clinic-hr { margin-top: 8px; font-size: 14.5px; color: var(--xy-teal-dark); letter-spacing: .02em; }
  .dx-clinic-cell.is-off .dx-clinic-wd, .dx-clinic-cell.is-off .dx-clinic-hr { color: #c4bdb4; }
  .dx-clinic-cell.is-on { background: rgba(220, 236, 234, .45); }
  .dx-clinic-cell.is-on .dx-clinic-wd { color: var(--xy-teal-dark); font-weight: 600; }
  .dx-clinic-place { margin-top: 26px; font-size: 15px; color: var(--xy-text-secondary); line-height: 1.9; }
  .dx-clinic-place b { font-family: var(--serif); font-weight: 500; color: var(--xy-text); margin-right: 12px; }
  .dx-tel { color: var(--xy-teal-dark); border-bottom: 1px solid var(--xy-border); }
  .dx-hours-note { margin-top: 10px; font-size: 13.5px; color: var(--xy-text-secondary); }
  .dx-hours .dx-hero-cta { margin-top: 30px; }

  /* ── 專業認證：徽章＋證書照片（證書保留） ── */
  .dx-certs { background: var(--xy-warm-white); border-top: 1px solid var(--xy-border); }
  .dx-certs-inner { max-width: 1080px; margin: 0 auto; }
  .dx-certs-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
  .dx-cert-card {
    display: inline-flex; align-items: center; gap: 12px;
    padding: 12px 22px; border: 1px solid var(--xy-border); border-radius: 6px; background: var(--xy-ivory);
    font-family: var(--serif); font-size: 15.5px; color: var(--xy-text); letter-spacing: .04em;
  }
  .dx-cert-mark { color: var(--xy-gold); font-size: 12px; }
  .dx-cert-photos-title { text-align: center; margin: 64px 0 26px; font-family: var(--serif); font-size: 20px; font-weight: 500; letter-spacing: .1em; }
  .dx-cert-photos-title span { display: block; font-family: var(--display); font-size: 12.5px; letter-spacing: .3em; color: var(--xy-gold); margin-bottom: 6px; }
  .dr-cert-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .dr-cert-item { margin: 0; background: var(--xy-ivory); border: 1px solid var(--xy-border); border-radius: 14px; padding: 12px; }
  .dr-cert-item img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: contain; border-radius: 4px; background: #fff; }
  .dr-cert-item figcaption { margin-top: 10px; font-size: 13.5px; line-height: 1.6; color: var(--xy-text-secondary); text-align: center; letter-spacing: .03em; }

  /* ── 底部 CTA ── */
  .dr-cta { background: var(--xy-cream); padding: 90px 24px; text-align: center; }
  .dr-cta-inner { max-width: 620px; margin: 0 auto; }
  .dr-cta h2 { font-family: var(--serif); font-size: clamp(24px, 3vw, 30px); font-weight: 500; }
  .dr-cta p { margin-top: 16px; font-size: 15.5px; line-height: 2; color: var(--xy-text-secondary); }
  .dr-cta-actions { margin-top: 30px; display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }

  @media (max-width: 960px) {
    .dx-hero { grid-template-columns: 1fr; }
    .dx-portrait { position: static; max-width: 460px; }
    .dx-bio-list { grid-template-columns: 1fr; }
    .dr-cert-grid { grid-template-columns: 1fr 1fr; }
  }
  @media (max-width: 640px) {
    .dx-hero-section { padding: 110px 20px 64px; }
    .dx-bio-block { grid-template-columns: 1fr; gap: 8px; }
    .dx-bio-label { border-right: none; border-bottom: 1px solid var(--xy-border); text-align: left; padding: 0 0 6px; width: fit-content; }
    .dx-clinic-grid { grid-template-columns: repeat(4, 1fr); }
    .dx-clinic-cell { border-top: 1px solid var(--xy-border); }
    .dx-clinic-cell:nth-child(-n+4) { border-top: none; }
    .dx-clinic-cell:nth-child(4n+1) { border-left: none; }
    .dx-clinic-hr { font-size: 12.5px; letter-spacing: 0; white-space: nowrap; }
    .dx-hero-cta { width: 100%; justify-content: center; }
    .dr-cert-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
