<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>電音波拉提｜初纖顏醫境診所 XIAN YAN · MEDIREALM</title>
<meta name="description" content="纖顏醫境電音波拉提：以專業醫療評估為核心，依照不同肌膚狀態與需求，規劃適合的電波與音波療程。">
<link rel="icon" href="/images/chu-logo-mark.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css?v=18">
<style>
  .lt-hero { background: var(--xy-ivory); padding: 170px 24px 84px; text-align: center; }
  .lt-hero .eyebrow { justify-content: center; }
  .lt-hero h1 { font-family: var(--serif); font-size: clamp(32px, 4.6vw, 48px); font-weight: 500; line-height: 1.5; margin: 14px 0 18px; }
  .lt-hero p { font-size: 16.5px; line-height: 2; color: var(--xy-text-secondary); max-width: 560px; margin: 0 auto; }
  .lt-breadcrumb { font-size: 13.5px; color: var(--xy-text-secondary); letter-spacing: .04em; margin-bottom: 30px; }
  .lt-breadcrumb a { color: var(--xy-teal-dark); border-bottom: 1px solid rgba(206,154,75,.4); padding-bottom: 2px; }
  .lt-breadcrumb a:hover { color: var(--xy-gold); }

  .lt-devices { background: var(--xy-cream); padding: 90px 24px 110px; }
  .lt-devices-inner { max-width: 1080px; margin: 0 auto; }
  .lt-devices .eyebrow { justify-content: center; }
  .lt-devices h2 { font-family: var(--serif); font-size: clamp(26px, 3.2vw, 34px); font-weight: 500; text-align: center; margin-top: 10px; }
  .lt-grid { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(28px, 3.4vw, 48px); margin-top: 60px; }
  a.lt-card-link { display: block; color: inherit; cursor: pointer; }
  .lt-card {
    background: var(--xy-warm-white);
    border: 1px solid var(--xy-border);
    border-radius: var(--radius);
    overflow: hidden;
    transition: transform .3s ease, box-shadow .3s ease, border-color .3s ease;
  }
  .lt-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 16px 40px rgba(60, 55, 45, .08);
    border-color: rgba(206, 154, 75, .35);
  }
  .lt-card-visual {
    height: 400px;
    display: flex; align-items: center; justify-content: center;
    padding: 36px 30px;
    background: linear-gradient(165deg, rgba(114,186,180,.07), rgba(251,248,243,.9) 55%, rgba(228,190,124,.1));
  }
  .lt-card-visual img {
    max-width: 100%; max-height: 100%;
    width: auto; height: auto;
    object-fit: contain;
    transition: transform .3s ease;
  }
  .lt-card:hover .lt-card-visual img { transform: scale(1.02); }
  .lt-card-body { padding: 30px 34px 36px; text-align: center; border-top: 1px solid var(--xy-border); }
  .lt-card-cat {
    font-family: var(--display); font-size: 11.5px;
    letter-spacing: .28em; color: var(--xy-gold);
  }
  .lt-card-cat i { font-style: normal; margin-left: 10px; letter-spacing: .1em; font-family: var(--sans); font-size: 12px; color: var(--xy-teal-soft); }
  .lt-card-name { font-family: var(--serif); font-size: 26px; font-weight: 500; margin-top: 12px; }
  .lt-card-name small { display: block; font-size: 16px; font-weight: 400; color: var(--xy-text-secondary); letter-spacing: .1em; margin-top: 4px; }

  @media (max-width: 720px) {
    .lt-hero { padding: 140px 20px 64px; }
    .lt-grid { grid-template-columns: 1fr; }
    .lt-card-visual { height: 320px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .lt-card, .lt-card-visual img { transition: none; }
    .lt-card:hover { transform: none; }
    .lt-card:hover .lt-card-visual img { transform: none; }
  }
</style>
</head>
<body>
<a class="skip-link" href="#ltMain">跳到主要內容</a>

<header class="nav" id="siteNav">
  <div class="wrap nav-inner">
    <a class="brand" href="/" aria-label="纖顏醫境 回首頁">
      <span class="brand-zh serif">初纖顏醫境診所</span>
      <span class="brand-en">XIAN YAN · MEDIREALM</span>
    </a>
    <button class="nav-toggle" id="navToggle" aria-label="開啟選單" aria-expanded="false" aria-controls="navLinks">
      <span></span><span></span><span></span>
    </button>
    <nav class="nav-links" id="navLinks" aria-label="主選單">
      <a href="/#services">醫療服務</a>
      <a href="/#locations">院所資訊</a>
      <a class="btn btn-primary btn-sm" href="/appointment">線上預約</a>
    </nav>
  </div>
</header>

<main id="ltMain">
  <section class="lt-hero">
    <p class="lt-breadcrumb"><a href="/">首頁</a> ／ <a href="/#services">醫療服務</a> ／ 電音波拉提</p>
    <p class="eyebrow" id="ltEyebrow"></p>
    <h1 id="ltTitle"></h1>
    <p id="ltSubtitle"></p>
  </section>
  <section class="lt-devices">
    <div class="lt-devices-inner">
      <p class="eyebrow center" id="ltDevicesEyebrow"></p>
      <h2 id="ltDevicesTitle"></h2>
      <div class="lt-grid" id="ltGrid"></div>
    </div>
  </section>
</main>

<footer class="footer">
  <div class="wrap footer-bottom" style="border-top:none">
    <p id="ltFooterCopy">© 初纖顏醫境診所</p>
  </div>
</footer>

<script src="/lifting.js"></script>
<script>
(function(){var t=document.getElementById('navToggle'),l=document.getElementById('navLinks');
if(t&&l){t.addEventListener('click',function(){var o=l.classList.toggle('open');t.setAttribute('aria-expanded',o?'true':'false');t.setAttribute('aria-label',o?'關閉選單':'開啟選單');});}})();
</script>
</body>
</html>
