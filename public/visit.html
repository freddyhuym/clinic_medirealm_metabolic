<style>
  .vs-head { background: var(--xy-ivory); padding: 150px 24px 64px; text-align: center; }
  .vs-breadcrumb { font-size: 13.5px; color: var(--xy-text-secondary); letter-spacing: .04em; margin-bottom: 30px; }
  .vs-breadcrumb a { color: var(--xy-teal-dark); border-bottom: 1px solid rgba(206,154,75,.4); padding-bottom: 2px; }
  .vs-subtitle { font-size: 17px; color: var(--xy-text-secondary); max-width: 620px; margin: 0 auto; }

  /* 院所卡片：左地圖、右資訊（參考曜妍分院資訊卡） */
  .vs-clinic-section { background: var(--xy-cream); padding: 72px 24px 96px; }
  .vs-card {
    max-width: 1120px; margin: 0 auto;
    display: grid; grid-template-columns: minmax(0, 58fr) minmax(0, 42fr);

    border-radius: 20px; overflow: hidden;
    box-shadow: 0 18px 44px rgba(60, 55, 45, .07);

  .vs-map { min-height: 440px; background: var(--xy-ivory); }
  .vs-map iframe { display: block; width: 100%; height: 100%; min-height: 440px; border: 0; }
  .vs-info { padding: clamp(30px, 3.6vw, 48px); display: flex; flex-direction: column; }
  .vs-info .eyebrow { margin-bottom: 6px; }
  .vs-name { font-family: var(--serif); font-size: clamp(24px, 2.6vw, 30px); font-weight: 500; line-height: 1.4; }
  .vs-hall { font-size: 15px; color: var(--xy-teal-dark); margin-top: 4px; letter-spacing: .06em; }
  .vs-rows { margin-top: 26px; display: grid; gap: 18px; }
  .vs-row { display: grid; grid-template-columns: 22px 1fr; gap: 12px; align-items: start; }
  .vs-row svg { width: 20px; height: 20px; color: var(--xy-gold); margin-top: 3px; }
  .vs-row b { display: block; font-size: 13px; font-weight: 500; letter-spacing: .14em; color: var(--xy-gold); }
  .vs-row p { font-size: 15.5px; line-height: 1.85; color: var(--xy-text); }
  .vs-tel { color: var(--xy-teal-dark); border-bottom: 1px solid var(--xy-border); padding-bottom: 1px; }
  .vs-tel:hover { color: var(--xy-gold); }
  .vs-hours { width: 100%; border-collapse: collapse; margin-top: 2px; }
  .vs-hours td { padding: 3px 0; font-size: 15px; color: var(--xy-text); }
  .vs-hours td:last-child { text-align: right; color: var(--xy-text-secondary); }
  .vs-hours tr.is-off td { color: #b7afa5; }
  .vs-actions { margin-top: auto; padding-top: 30px; display: flex; flex-wrap: wrap; gap: 12px; }
  .vs-actions .btn { padding: 12px 24px; font-size: 15px; }
  .vs-note { max-width: 1120px; margin: 18px auto 0; font-size: 13.5px; color: var(--xy-text-secondary); text-align: center; }

  /* 初診流程：沿用首頁「第一次來，怎麼安排？」資料 */
  .vs-steps-section { background: var(--xy-ivory); padding: clamp(72px, 8vw, 110px) 24px; }
  .vs-steps-section .fv-steps { max-width: 1120px; margin-left: auto; margin-right: auto; }
  .vs-cta { text-align: center; margin-top: 44px; }

  @media (max-width: 900px) {
    .vs-card { grid-template-columns: 1fr; }
    .vs-map, .vs-map iframe { min-height: 320px; }
  }
  @media (max-width: 640px) {
    .vs-head { padding-top: 130px; }
    .vs-actions .btn { flex: 1 1 100%; text-align: center; }
  }
