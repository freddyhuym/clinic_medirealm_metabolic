<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文章列表｜纖顏醫境 XIAN YAN · MEDIREALM</title>
<meta name="description" content="纖顏醫境專欄文章列表，帶您深入了解醫學美容的正確知識。">
<link rel="icon" href="/images/chu-logo-mark.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css?v=12">
<style>
  .ar-hero { background: var(--xy-ivory); padding: 150px 24px 60px; }
  .ar-hero-inner { max-width: 860px; margin: 0 auto; }
  .ar-breadcrumb { font-size: 13.5px; color: var(--xy-text-secondary); letter-spacing: .04em; margin-bottom: 30px; }
  .ar-breadcrumb a { color: var(--xy-teal-dark); border-bottom: 1px solid rgba(206,154,75,.4); padding-bottom: 2px; }
  .ar-hero h1 { font-family: var(--serif); font-size: clamp(30px, 4vw, 42px); font-weight: 500; margin-top: 10px; }
  .ar-intro { margin-top: 16px; font-size: 15.5px; line-height: 2; color: var(--xy-text-secondary); max-width: 640px; }

  .ar-main { background: var(--xy-cream); padding: 56px 24px 90px; min-height: 40vh; }
  .ar-main-inner { max-width: 860px; margin: 0 auto; }
  .ar-list { display: grid; gap: 18px; }
  .ar-card {
    display: block; color: inherit; background: var(--xy-warm-white);
    border: 1px solid var(--xy-border); border-radius: var(--radius);
    padding: 28px 32px; transition: transform .3s var(--ease), box-shadow .3s var(--ease);
  }
  a.ar-card:hover { transform: translateY(-3px); box-shadow: 0 14px 34px rgba(60, 55, 45, .08); }
  .ar-card-meta { font-family: var(--display); font-size: 13px; letter-spacing: .16em; color: var(--xy-gold); }
  .ar-card h2 { font-family: var(--serif); font-size: 21px; font-weight: 500; margin-top: 8px; }
  .ar-card p { margin-top: 10px; font-size: 15px; line-height: 1.95; color: var(--xy-text-secondary); }

  .ar-empty {
    text-align: center; padding: 90px 24px;
    background: var(--xy-warm-white); border: 1px dashed rgba(114,186,180,.45); border-radius: var(--radius);
  }
  .ar-empty-mark { font-family: var(--display); font-style: italic; font-size: 15px; letter-spacing: .2em; color: var(--xy-teal-dark); }
  .ar-empty h2 { font-family: var(--serif); font-size: clamp(22px, 2.6vw, 26px); font-weight: 500; margin-top: 14px; }
  .ar-empty p { margin-top: 12px; font-size: 15px; line-height: 2; color: var(--xy-text-secondary); }
  .ar-empty .btn { margin-top: 26px; }

  @media (max-width: 900px) {
    .ar-hero { padding: 130px 20px 48px; }
    .ar-card { padding: 24px 22px; }
  }
</style>
</head>
<body>
<a class="skip-link" href="#arMain">跳到主要內容</a>

<header class="nav" id="siteNav">
  <div class="wrap nav-inner">
    <a class="brand" href="/" aria-label="纖顏醫境 回首頁">
      <span class="brand-zh serif">纖顏醫境</span>
      <span class="brand-en">XIAN YAN · MEDIREALM</span>
    </a>
    <button class="nav-toggle" id="navToggle" aria-label="開啟選單" aria-expanded="false" aria-controls="navLinks">
      <span></span><span></span><span></span>
    </button>
    <nav class="nav-links" id="navLinks" aria-label="主選單">
      <a href="/#services">醫療服務</a>
      <a href="/#locations">三大院所</a>
      <a class="btn btn-primary btn-sm" href="/#contact">預約諮詢</a>
    </nav>
  </div>
</header>

<main id="arMain">
  <section class="ar-hero">
    <div class="ar-hero-inner">
      <p class="ar-breadcrumb"><a href="/">首頁</a> ／ <span>文章列表</span></p>
      <p class="eyebrow" id="arEyebrow"></p>
      <h1 id="arTitle">文章列表</h1>
      <p class="ar-intro" id="arIntro"></p>
    </div>
  </section>
  <section class="ar-main">
    <div class="ar-main-inner" id="arList"></div>
  </section>
</main>

<footer class="footer">
  <div class="wrap footer-bottom" style="border-top:none">
    <p id="arFooterCopy">© 纖顏醫境體系</p>
  </div>
</footer>

<script src="/articles.js"></script>
<script>
(function(){var t=document.getElementById('navToggle'),l=document.getElementById('navLinks');
if(t&&l){t.addEventListener('click',function(){var o=l.classList.toggle('open');t.setAttribute('aria-expanded',o?'true':'false');t.setAttribute('aria-label',o?'關閉選單':'開啟選單');});}})();
</script>
</body>
</html>
